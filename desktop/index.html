<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentCorp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(56, 189, 248, 0.25);
      animation: pulse 2s ease-in-out infinite;
    }
    .logo svg { width: 32px; height: 32px; fill: white; }
    .text { text-align: center; }
    .text h2 { font-size: 16px; color: #1f2937; font-weight: 600; }
    .text p { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .spinner {
      width: 20px; height: 20px;
      border: 2.5px solid #e5e7eb;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
    </div>
    <div class="text">
      <h2>AgentCorp</h2>
      <p>Preparing your workspace...</p>
    </div>
    <div class="spinner"></div>
  </div>
</body>
</html>
