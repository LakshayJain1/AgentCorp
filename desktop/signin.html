<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to AgentCorp</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; background: #FAFBFD; color: #1c1c1e;
      -webkit-app-region: drag;
    }
    button { -webkit-app-region: no-drag; }
    .card { text-align: center; max-width: 380px; padding: 32px; }
    .logo {
      width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #0A84FF, #30B0C7);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 16px 40px rgba(10,132,255,0.35);
      font-size: 28px; color: #fff; font-weight: 800;
    }
    h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.02em; }
    p { font-size: 13px; color: #666; line-height: 1.5; margin: 0 0 24px; }
    button {
      padding: 12px 28px; border-radius: 999px; border: none;
      background: #17201C; color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #253229; }
    .hint { margin-top: 16px; font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">A</div>
    <h1>Sign in to AgentCorp</h1>
    <p>Authentication happens securely in your browser. After signing in, you'll be redirected straight back into the desktop app.</p>
    <button id="signin">Continue in browser</button>
    <p class="hint">Nothing to enter here — no passwords touch this app.</p>
  </div>
  <script>
    document.getElementById('signin').addEventListener('click', () => {
      if (window.electronAPI && window.electronAPI.startBrowserSignin) {
        window.electronAPI.startBrowserSignin();
      }
    });
  </script>
</body>
</html>
